name: gates

# The gates every change must pass before it reaches main (main is what GitHub Pages publishes).
# privacy: forbidden names (from the WATCHLIST secret, never stored in the repository), secret-shaped strings, passphrases.
# site: the site's own checks in tools/site_check.mjs, when that file exists.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: privacy gate selftest
        run: python tools/privacy_gate.py --selftest
      - name: privacy gate
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python tools/privacy_gate.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history, so that the mutation test can name what a pull request changed (git diff origin/main...HEAD)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # 22: tools/drive.mjs talks to Chrome over the WebSocket Node has had since 22; its selftest and that of
          # tools/invariants.mjs run below, on the runner's Chrome
          node-version: "22"
      - name: site checks
        run: |
          if [ -f tools/site_check.mjs ]; then node tools/site_check.mjs; else echo "NOT_CHECKED: tools/site_check.mjs does not exist yet (the first roadmap item builds it)"; fi
      - name: level ladders
        run: |
          if [ -f tools/levels.mjs ]; then node tools/levels.mjs selftest && node tools/levels.mjs check; else echo "NOT_CHECKED: tools/levels.mjs does not exist"; fi
      # On a pull request tools/lab_tests.mjs asks git what changed since main (renames split, as mutate does) and runs
      # only the test files a change can reach (their imports, the files they name or list, their data folders); a
      # change it cannot place, or to the runner, runs them all. On a push to main every test runs. It says which way.
      - name: lab tests
        run: |
          if [ -f tools/lab_tests.mjs ]; then
            since=""
            if [ "${{ github.event_name }}" = "pull_request" ]; then since="--changed-since origin/main"; fi
            node tools/lab_tests.mjs selftest && node tools/lab_tests.mjs $since
          else echo "NOT_CHECKED: tools/lab_tests.mjs does not exist"; fi
      - name: atlas
        run: |
          if [ -f tools/atlas.mjs ]; then node tools/atlas.mjs selftest && node tools/atlas.mjs; else echo "NOT_CHECKED: tools/atlas.mjs does not exist"; fi
      - name: stories
        run: |
          if [ -f tools/stories.mjs ]; then node tools/stories.mjs selftest && node tools/stories.mjs; else echo "NOT_CHECKED: tools/stories.mjs does not exist"; fi
      - name: evolution
        run: |
          if [ -f tools/evolution.mjs ]; then node tools/evolution.mjs selftest && node tools/evolution.mjs; else echo "NOT_CHECKED: tools/evolution.mjs does not exist"; fi
      # the page driver and the rules a page keeps after every step of a drive, in the runner's headless Chrome
      - name: drive and invariants
        run: |
          if [ -f tools/drive.mjs ]; then node tools/drive.mjs selftest; else echo "NOT_CHECKED: tools/drive.mjs does not exist"; fi
          if [ -f tools/invariants.mjs ]; then node tools/invariants.mjs selftest; else echo "NOT_CHECKED: tools/invariants.mjs does not exist"; fi
      # a selftest is only as good as the broken rules it catches: each listed rule is broken in a copy and must fail it.
      # On a pull request tools/mutate.mjs asks git what changed since main (renames split) and runs a list (drive and
      # invariants, about 55 minutes here; mutate's own, about 8; every other list since 2026-11-21) only when one of its
      # files changed; on a push to main every list runs. It says which way it went.
      - name: mutation test of the gates
        run: |
          if [ -f tools/mutate.mjs ]; then
            since=""
            if [ "${{ github.event_name }}" = "pull_request" ]; then since="--changed-since origin/main"; fi
            node tools/mutate.mjs selftest && node tools/mutate.mjs $since
          else echo "NOT_CHECKED: tools/mutate.mjs does not exist"; fi
      - name: model route tests
        run: |
          if [ -f workers/model-route/test.mjs ]; then node workers/model-route/test.mjs; else echo "NOT_CHECKED: workers/model-route/test.mjs does not exist"; fi
      - name: anti-tells
        run: |
          if [ -f tools/anti_tells.mjs ]; then node tools/anti_tells.mjs selftest && node tools/anti_tells.mjs; else echo "NOT_CHECKED: tools/anti_tells.mjs does not exist"; fi
      # labs-src: rebuild the TypeScript the labs ship (Labs OS), fail if the committed output differs, run its tests.
      - name: labs build
        run: |
          if [ -f labs-src/package.json ]; then
            cd labs-src
            npm ci --no-audit --no-fund
            npm run build
            git diff --exit-code -- ../labs/assets/js/os
            new_files="$(git ls-files --others --exclude-standard -- ../labs/assets/js/os)"
            if [ -n "$new_files" ]; then
              echo "a fresh build of labs-src makes files the commit lacks; run npm run build in labs-src and commit the output:"
              echo "$new_files"
              exit 1
            fi
            npm test
          else echo "NOT_CHECKED: labs-src/package.json does not exist"; fi
