name: gates

# The gates every change must pass before it reaches main (main is what GitHub Pages publishes).
# privacy: forbidden names (from the WATCHLIST secret, never stored in the repository), secret-shaped strings, passphrases.
# site: the site's own checks in tools/site_check.mjs, when that file exists.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: privacy gate selftest
        run: python tools/privacy_gate.py --selftest
      - name: privacy gate
        env:
          WATCHLIST: ${{ secrets.WATCHLIST }}
        run: python tools/privacy_gate.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: site checks
        run: |
          if [ -f tools/site_check.mjs ]; then node tools/site_check.mjs; else echo "NOT_CHECKED: tools/site_check.mjs does not exist yet (the first roadmap item builds it)"; fi
      - name: level ladders
        run: |
          if [ -f tools/levels.mjs ]; then node tools/levels.mjs selftest && node tools/levels.mjs check; else echo "NOT_CHECKED: tools/levels.mjs does not exist"; fi
      - name: lab tests
        run: |
          if [ -f tools/lab_tests.mjs ]; then node tools/lab_tests.mjs; else echo "NOT_CHECKED: tools/lab_tests.mjs does not exist"; fi
      - name: atlas
        run: |
          if [ -f tools/atlas.mjs ]; then node tools/atlas.mjs selftest && node tools/atlas.mjs; else echo "NOT_CHECKED: tools/atlas.mjs does not exist"; fi
      - name: anti-tells
        run: |
          if [ -f tools/anti_tells.mjs ]; then node tools/anti_tells.mjs selftest && node tools/anti_tells.mjs; else echo "NOT_CHECKED: tools/anti_tells.mjs does not exist"; fi
      # labs-src: rebuild the TypeScript the labs ship (Labs OS), fail if the committed output differs, run its tests.
      - name: labs build
        run: |
          if [ -f labs-src/package.json ]; then
            cd labs-src
            npm ci --no-audit --no-fund
            npm run build
            git diff --exit-code -- ../labs/assets/js/os
            new_files="$(git ls-files --others --exclude-standard -- ../labs/assets/js/os)"
            if [ -n "$new_files" ]; then
              echo "a fresh build of labs-src makes files the commit lacks; run npm run build in labs-src and commit the output:"
              echo "$new_files"
              exit 1
            fi
            npm test
          else echo "NOT_CHECKED: labs-src/package.json does not exist"; fi
